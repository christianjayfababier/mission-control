name: smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  # Cancel superseded runs on pull requests only. On main every merge commit gets its own completed run, so the PR
  # watch never sees a "cancelled" post-merge step when two PRs land within a minute of each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    # Windows is the app's only target, and Electron renders there without a virtual display.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No @electron/rebuild step on purpose: node-pty's binary is built for Node, not Electron, so
      # require('node-pty') throws on CI. main.js catches that (pty/ptyError) and the app boots without
      # terminals, which is all the smoke test needs. Keeping CI light is deliberate.
      - run: npm test
